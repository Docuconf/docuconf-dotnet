name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # The shared conformance suite (SPEC §12), run by tests/Docuconf.Tests/ConformanceTests.cs.
      DOCUCONF_CONFORMANCE: ${{ github.workspace }}/docuconf-go/conformance/cases.json
      DOCUCONF_REQUIRE_CONFORMANCE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: docuconf/docuconf-go
          ref: main
          path: docuconf-go
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      # The export tests check contracts against the CUE meta-schema.
      - run: go install cuelang.org/go/cmd/cue@v0.17.1
      - run: dotnet build -c Release
      - run: dotnet test -c Release --no-build
      # Install the packed package from a local feed into a clean app and use it.
      - run: ./scripts/smoke-consumer.sh

  example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: docuconf/docuconf-go
          ref: main
          path: docuconf-go
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: go install cuelang.org/go/cmd/cue@v0.17.1
      - name: Build examples/orders
        run: dotnet build examples/orders -c Release
      # Ignores metadata.generator.version, which release PRs bump.
      - name: contract.cue is up to date
        run: |
          dotnet examples/orders/bin/Release/net10.0/Orders.Api.dll docuconf export "$RUNNER_TEMP/contract.cue"
          scripts/check-generated.sh --files examples/orders/contract.cue "$RUNNER_TEMP/contract.cue"
      - name: contract.cue passes the meta-schema
        run: |
          mkdir -p "$RUNNER_TEMP/cue/orders"
          cp -r docuconf-go/spec/cue/cue.mod docuconf-go/spec/cue/contract "$RUNNER_TEMP/cue/"
          cp examples/orders/contract.cue "$RUNNER_TEMP/cue/orders/"
          cd "$RUNNER_TEMP/cue" && "$(go env GOPATH)/bin/cue" vet -c ./orders
      - name: Smoke test
        run: examples/orders/smoke.sh
