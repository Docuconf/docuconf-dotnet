name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      docuconf_go_ref:
        description: docuconf-go ref to test against (empty = .github/docuconf-go.ref)
        required: false
        default: ""
  # Nightly against docuconf-go main, to catch spec changes before a bump PR.
  schedule:
    - cron: "23 5 * * *"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # The shared conformance suite (SPEC §12), run by tests/Docuconf.Tests/ConformanceTests.cs.
      DOCUCONF_CONFORMANCE: ${{ github.workspace }}/docuconf-go/conformance/cases.json
      DOCUCONF_REQUIRE_CONFORMANCE: "1"
      # The export tests vet contracts against the pinned docuconf-go meta-schema, not the copy in spec/.
      DOCUCONF_SPEC_CUE: ${{ github.workspace }}/docuconf-go/spec/cue
    steps:
      - uses: actions/checkout@v4
      - name: Pick the docuconf-go ref
        id: dcref
        env:
          EVENT: ${{ github.event_name }}
          INPUT_REF: ${{ inputs.docuconf_go_ref }}
        run: |
          if [ "$EVENT" = schedule ]; then echo "ref=main" >> "$GITHUB_OUTPUT"
          elif [ -n "$INPUT_REF" ]; then echo "ref=$INPUT_REF" >> "$GITHUB_OUTPUT"
          else echo "ref=$(tr -d '[:space:]' < .github/docuconf-go.ref)" >> "$GITHUB_OUTPUT"; fi
      - name: Check out docuconf-go
        uses: actions/checkout@v4
        with:
          repository: docuconf/docuconf-go
          path: docuconf-go
          ref: ${{ steps.dcref.outputs.ref }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      # The export tests check contracts against the CUE meta-schema.
      - run: go install cuelang.org/go/cmd/cue@v0.17.1
      # The docuconf-go-facing subset (conformance suite, cue vet of exported
      # contracts); docuconf-go's downstream workflow runs the same script.
      - name: Run scripts/conformance.sh
        run: scripts/conformance.sh
        env:
          DOCUCONF_GO_DIR: ${{ github.workspace }}/docuconf-go
      - run: dotnet build -c Release
      # Unit tests on net10.0 and net8.0, the conformance suite, the analyzer, and the README snippets.
      - run: dotnet test -c Release --no-build
      # Install the packed package from a local feed into clean .NET 10 and .NET 8 apps and use it.
      - run: ./scripts/smoke-consumer.sh

  example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pick the docuconf-go ref
        id: dcref
        env:
          EVENT: ${{ github.event_name }}
          INPUT_REF: ${{ inputs.docuconf_go_ref }}
        run: |
          if [ "$EVENT" = schedule ]; then echo "ref=main" >> "$GITHUB_OUTPUT"
          elif [ -n "$INPUT_REF" ]; then echo "ref=$INPUT_REF" >> "$GITHUB_OUTPUT"
          else echo "ref=$(tr -d '[:space:]' < .github/docuconf-go.ref)" >> "$GITHUB_OUTPUT"; fi
      - name: Check out docuconf-go
        uses: actions/checkout@v4
        with:
          repository: docuconf/docuconf-go
          path: docuconf-go
          ref: ${{ steps.dcref.outputs.ref }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: go install cuelang.org/go/cmd/cue@v0.17.1
      # The build-time export in check mode fails the build when contract.cue is out of date.
      - name: Build examples/orders; contract.cue is up to date
        run: dotnet build examples/orders -c Release -p:DocuconfContractCheck=true
      - name: contract.cue passes the meta-schema
        run: |
          mkdir -p "$RUNNER_TEMP/cue/orders"
          cp -r docuconf-go/spec/cue/cue.mod docuconf-go/spec/cue/contract "$RUNNER_TEMP/cue/"
          cp examples/orders/contract.cue "$RUNNER_TEMP/cue/orders/"
          cd "$RUNNER_TEMP/cue" && "$(go env GOPATH)/bin/cue" vet -c ./orders
      - name: Smoke test
        run: examples/orders/smoke.sh
