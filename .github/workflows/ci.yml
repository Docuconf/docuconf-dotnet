name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # The shared conformance suite (SPEC §12), run by tests/Docuconf.Tests/ConformanceTests.cs.
      DOCUCONF_CONFORMANCE: ${{ github.workspace }}/docuconf-go/conformance/cases.json
      DOCUCONF_REQUIRE_CONFORMANCE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: docuconf/docuconf-go
          ref: main
          path: docuconf-go
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      # The export tests check contracts against the CUE meta-schema.
      - run: go install cuelang.org/go/cmd/cue@v0.17.1
      - run: dotnet build -c Release
      # Unit tests on net10.0 and net8.0, the conformance suite, the analyzer, and the README snippets.
      - run: dotnet test -c Release --no-build
      # Install the packed package from a local feed into clean .NET 10 and .NET 8 apps and use it.
      - run: ./scripts/smoke-consumer.sh

  example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: docuconf/docuconf-go
          ref: main
          path: docuconf-go
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: go install cuelang.org/go/cmd/cue@v0.17.1
      # The build-time export in check mode fails the build when contract.cue is out of date.
      - name: Build examples/orders; contract.cue is up to date
        run: dotnet build examples/orders -c Release -p:DocuconfContractCheck=true
      - name: contract.cue passes the meta-schema
        run: |
          mkdir -p "$RUNNER_TEMP/cue/orders"
          cp -r docuconf-go/spec/cue/cue.mod docuconf-go/spec/cue/contract "$RUNNER_TEMP/cue/"
          cp examples/orders/contract.cue "$RUNNER_TEMP/cue/orders/"
          cd "$RUNNER_TEMP/cue" && "$(go env GOPATH)/bin/cue" vet -c ./orders
      - name: Smoke test
        run: examples/orders/smoke.sh
