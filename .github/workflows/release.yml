name: release

# Push a tag such as v0.1.0 or v0.2.0-beta.1 to publish Docuconf.Options to nuget.org.
# Uses NuGet trusted publishing: GitHub's OIDC token is exchanged for a short-lived,
# single-use API key, so no NuGet key is stored in the repository.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write
    env:
      # The shared conformance suite (SPEC §12), run by tests/Docuconf.Tests/ConformanceTests.cs.
      DOCUCONF_CONFORMANCE: ${{ github.workspace }}/docuconf-go/conformance/cases.json
      DOCUCONF_REQUIRE_CONFORMANCE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Pick the docuconf-go ref
        id: dcref
        run: echo "ref=$(tr -d '[:space:]' < .github/docuconf-go.ref)" >> "$GITHUB_OUTPUT"
      - name: Check out docuconf-go
        uses: actions/checkout@v4
        with:
          repository: docuconf/docuconf-go
          path: docuconf-go
          ref: ${{ steps.dcref.outputs.ref }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: go install cuelang.org/go/cmd/cue@v0.17.1

      - name: Version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - run: dotnet build -c Release -p:Version="$VERSION"
      - run: dotnet test -c Release --no-build
      - run: ./scripts/smoke-consumer.sh
      - run: dotnet pack src/Docuconf -c Release --no-build -p:Version="$VERSION" -o artifacts

      - name: NuGet login (trusted publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      # The .snupkg symbol package is pushed alongside the .nupkg.
      - run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

  # Also pushes the package to GitHub Packages (nuget.pkg.github.com) and
  # attaches the .nupkg and .snupkg to the GitHub Release for the tag. It runs
  # the same checks as `publish` but does not depend on it, so it works with
  # only the workflow's GITHUB_TOKEN. See RELEASING.md.
  github:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release and upload its assets
      packages: write # push to nuget.pkg.github.com
    env:
      DOCUCONF_CONFORMANCE: ${{ github.workspace }}/docuconf-go/conformance/cases.json
      DOCUCONF_REQUIRE_CONFORMANCE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Pick the docuconf-go ref
        id: dcref
        run: echo "ref=$(tr -d '[:space:]' < .github/docuconf-go.ref)" >> "$GITHUB_OUTPUT"
      - name: Check out docuconf-go
        uses: actions/checkout@v4
        with:
          repository: docuconf/docuconf-go
          path: docuconf-go
          ref: ${{ steps.dcref.outputs.ref }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: go install cuelang.org/go/cmd/cue@v0.17.1

      - name: Version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - run: dotnet build -c Release -p:Version="$VERSION"
      - run: dotnet test -c Release --no-build
      - run: ./scripts/smoke-consumer.sh
      - run: dotnet pack src/Docuconf -c Release --no-build -p:Version="$VERSION" -o artifacts

      # --no-symbols: the .snupkg is pushed on its own below, so a registry
      # that rejects symbol packages does not fail the main push.
      - name: Push the .nupkg to GitHub Packages
        run: >-
          dotnet nuget push "artifacts/*.nupkg"
          --source https://nuget.pkg.github.com/Docuconf/index.json
          --api-key "${{ secrets.GITHUB_TOKEN }}"
          --skip-duplicate --no-symbols

      - name: Push the .snupkg to GitHub Packages
        continue-on-error: true
        run: >-
          dotnet nuget push "artifacts/*.snupkg"
          --source https://nuget.pkg.github.com/Docuconf/index.json
          --api-key "${{ secrets.GITHUB_TOKEN }}"
          --skip-duplicate

      - name: Attach the packages to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            flags=()
            case "$VERSION" in *-*) flags+=(--prerelease) ;; esac
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "Docuconf.Options $VERSION" "${flags[@]}"
          fi
          gh release upload "$GITHUB_REF_NAME" artifacts/*.nupkg artifacts/*.snupkg --clobber
