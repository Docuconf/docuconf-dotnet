name: release

# Push a tag such as v0.1.0 or v0.2.0-beta.1 to publish Docuconf.Options to nuget.org.
# Uses NuGet trusted publishing: GitHub's OIDC token is exchanged for a short-lived,
# single-use API key, so no NuGet key is stored in the repository.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write
    env:
      # The shared conformance suite (SPEC §12), run by tests/Docuconf.Tests/ConformanceTests.cs.
      DOCUCONF_CONFORMANCE: ${{ github.workspace }}/docuconf-go/conformance/cases.json
      DOCUCONF_REQUIRE_CONFORMANCE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: docuconf/docuconf-go
          ref: main
          path: docuconf-go
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: go install cuelang.org/go/cmd/cue@v0.17.1

      - name: Version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - run: dotnet build -c Release -p:Version="$VERSION"
      - run: dotnet test -c Release --no-build
      - run: ./scripts/smoke-consumer.sh
      - run: dotnet pack src/Docuconf -c Release --no-build -p:Version="$VERSION" -o artifacts

      - name: NuGet login (trusted publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      # The .snupkg symbol package is pushed alongside the .nupkg.
      - run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
